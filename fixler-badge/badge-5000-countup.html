<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARN-badge</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f2}
  .arn-badge{width:min(420px,90vw);height:auto;display:block}
</style>
</head>
<body>

<!-- Kopiera från här ... -->
<svg class="arn-badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t">
  <title id="t">Baserat på 5 000 ARN-ärenden</title>
  <defs>
    <path id="arcTop" d="M 200 400 A 200 200 0 0 1 600 400"/>
    <path id="arcBottom" d="M 172 400 A 228 228 0 0 0 628 400"/>
    <clipPath id="disc"><circle cx="400" cy="400" r="328"/></clipPath>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .b{--green:#17673a;--soft:#b5cdc1;--ease:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.56,.64,1)}
    .b *{transform-box:view-box;transform-origin:400px 400px}
    .ring{fill:none;stroke:var(--green);transform:rotate(-90deg)}
    .draw{stroke-dasharray:1;animation:draw 1.2s var(--ease) both}
    .ring-thin{animation-name:drawRev;animation-delay:.25s;animation-duration:1.3s}
    .inner{fill:none;stroke:var(--soft);stroke-width:2;animation:grow .9s var(--ease) .55s both}
    .dot{fill:var(--green);transform-box:fill-box;transform-origin:center;animation:pop .5s var(--pop) both}
    .dot-l{animation-delay:1.15s}.dot-r{animation-delay:1.25s}
    .arc-text{fill:var(--green);font:700 34px/1 "Red Hat Display","DM Sans",Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:7px;text-transform:uppercase}
    .top{animation:swingTop 1s var(--ease) .8s both}
    .bottom{animation:swingBottom 1s var(--ease) .9s both}
    .num{fill:var(--green);font:800 136px/1 "Red Hat Display","DM Sans",Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-2px;font-variant-numeric:tabular-nums}
    .num-g{animation:num .9s var(--pop) 1.05s both}
    .sheen{animation:sheen 7s ease-in-out 2.4s infinite both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes drawRev{from{stroke-dashoffset:-1}to{stroke-dashoffset:0}}
    @keyframes grow{from{opacity:0;transform:scale(.6)}}
    @keyframes pop{from{opacity:0;transform:scale(0)}}
    @keyframes swingTop{from{opacity:0;transform:rotate(-28deg)}}
    @keyframes swingBottom{from{opacity:0;transform:rotate(28deg)}}
    @keyframes num{from{opacity:0;transform:scale(.55)}}
    @keyframes sheen{0%{transform:translateX(-900px) rotate(20deg)}35%,100%{transform:translateX(900px) rotate(20deg)}}
    .arn-badge:not(.is-visible) .b *{animation-play-state:paused}
    @media (prefers-reduced-motion:reduce){.b *{animation:none!important}}
  </style>
  <g class="b">
    <circle cx="400" cy="400" r="328" fill="#fff"/>
    <circle class="ring draw" cx="400" cy="400" r="322" stroke-width="12" pathLength="1"/>
    <circle class="ring draw ring-thin" cx="400" cy="400" r="296" stroke-width="2" pathLength="1"/>
    <circle class="inner" cx="400" cy="400" r="178"/>
    <circle class="dot dot-l" cx="148" cy="400" r="6"/>
    <circle class="dot dot-r" cx="652" cy="400" r="6"/>
    <g class="top"><text class="arc-text"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">Baserat på</textPath></text></g>
    <g class="bottom"><text class="arc-text"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">ARN-ärenden</textPath></text></g>
    <g class="num-g"><text class="num" data-count="5000" x="400" y="447" text-anchor="middle">5 000</text></g>
    <g clip-path="url(#disc)"><rect class="sheen" x="320" y="-200" width="160" height="1200" fill="url(#sheenGrad)" style="mix-blend-mode:soft-light"/></g>
  </g>
</svg>

<script>
(function () {
  document.querySelectorAll('.arn-badge').forEach(function (badge) {
    var num = badge.querySelector('[data-count]');
    var target = +num.getAttribute('data-count');
    var fmt = function (n) { return n.toLocaleString('sv-SE'); };
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function countUp() {
      if (reduce) return;
      var start = null, delay = 1050, dur = 1400;
      num.textContent = fmt(0);
      requestAnimationFrame(function step(t) {
        if (start === null) start = t;
        var p = Math.min(Math.max((t - start - delay) / dur, 0), 1);
        num.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 4))));
        if (p < 1) requestAnimationFrame(step);
      });
    }

    if (!('IntersectionObserver' in window)) { badge.classList.add('is-visible'); return; }
    new IntersectionObserver(function (entries, io) {
      if (!entries[0].isIntersecting) return;
      badge.classList.add('is-visible');
      countUp();
      io.disconnect();
    }, { threshold: 0.4 }).observe(badge);
  });
})();
</script>
<!-- ... till hit -->

</body>
</html>
